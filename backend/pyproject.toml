[project]
name = "medivita-api"
version = "1.0.0"
description = "Stateless Flask API for the MediVita health information companion"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.1",
  "Flask-Cors==6.0.1",
  "httpx==0.28.1",
  "gunicorn==23.0.0",
  "beautifulsoup4==4.15.0",
  "ddgs==9.14.4",
  "langchain-core==1.5.4",
  "langchain-groq==1.1.3",
  "langchain-openrouter==0.2.7",
  "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
